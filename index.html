<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viko POS — Compras, Inventario y Corte de Caja</title>
    <style>
        :root {
            --bg: #f4f6f8;
            --surface: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --primary: #1565c0;
            --primary-hover: #0d47a1;
            --success: #2e7d32;
            --danger: #c62828;
            --warning: #ed6c02;
            --soft: #eef2f7;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --google-bg: #ffffff;
            --google-hover: #f9fafb;
            --google-text: #111827;
            --google-border: #d1d5db;
        }

        body.dark-mode {
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --soft: #0f172a;
            --input-bg: #0f172a;
            --input-border: #475569;
            --google-bg: #0f172a;
            --google-hover: #1e293b;
            --google-text: #f8fafc;
            --google-border: #475569;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .hidden {
            display: none !important;
        }

        /* Pantalla de login */
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

            .login-card h1 {
                margin: 0 0 8px;
                font-size: 24px;
            }

            .login-card p {
                margin: 0 0 22px;
                color: var(--muted);
                font-size: 14px;
                line-height: 1.45;
            }

        .btn-google {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--google-border);
            background: var(--google-bg);
            color: var(--google-text);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

            .btn-google:hover {
                background: var(--google-hover);
            }

        .status-msg {
            margin-top: 14px;
            font-size: 13px;
            color: var(--danger);
            min-height: 18px;
        }

        /* Barra superior y navegación */
        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .brand-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand-title {
            font-weight: 700;
            font-size: 17px;
        }

        .sync-badge {
            font-size: 12px;
            color: var(--muted);
        }

        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .nav-btn {
            padding: 9px 14px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--soft);
            color: var(--text);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

            .nav-btn.active {
                background: var(--primary);
                color: #ffffff;
                border-color: var(--primary);
            }

        .user-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .btn {
            padding: 8px 13px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            background: var(--primary);
            color: #fff;
        }

            .btn:hover {
                opacity: 0.94;
            }

        .btn-secondary {
            background: var(--soft);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-warning {
            background: var(--warning);
            color: #fff;
        }

        .container {
            max-width: 1120px;
            margin: 20px auto;
            padding: 0 16px 40px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .search-input, .input, .select {
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 14px;
        }

        .search-input {
            min-width: 240px;
            flex: 1;
            max-width: 380px;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 14px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
        }

        .card-title {
            font-weight: 700;
            font-size: 16px;
            margin: 0 0 4px;
        }

        .card-meta {
            font-size: 13px;
            color: var(--muted);
        }

        .card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* Corte de Caja */
        .turno-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        .kpi-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .kpi-label {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            font-weight: 700;
        }

        .kpi-value {
            font-size: 24px;
            font-weight: 800;
            margin-top: 6px;
        }

        .list-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
        }

        .list-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 6px;
            border-bottom: 1px solid var(--border);
        }

            .list-row:last-child {
                border-bottom: none;
            }

        /* Modal */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 50;
        }

        .modal-card {
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            background: var(--surface);
            border-radius: 14px;
            padding: 22px;
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

            .form-group label {
                font-size: 13px;
                font-weight: 600;
            }

        .pill-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .pill-btn {
            padding: 6px 10px;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: var(--soft);
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

            .pill-btn.active {
                background: var(--primary);
                color: #fff;
                border-color: var(--primary);
            }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <!-- LOGIN CON GOOGLE -->
    <div id="loginView" class="login-wrap">
        <div class="login-card">
            <h1>Viko POS Web</h1>
            <p>Acceso exclusivo para <strong>Compras</strong>, <strong>Inventario</strong> y <strong>Corte de Caja</strong>, sincronizado en tiempo real con tu cuenta.</p>
            <button id="btnGoogleLogin" class="btn-google" type="button">
                <span>Continuar con Google</span>
            </button>
            <div id="loginError" class="status-msg"></div>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="appView" class="hidden">
        <header class="topbar">
            <div class="brand-info">
                <div id="lblNegocio" class="brand-title">Viko POS</div>
                <div id="lblSyncStatus" class="sync-badge">Listo para sincronizar</div>
            </div>

            <nav class="nav-tabs">
                <button id="tabCompras" class="nav-btn active" type="button" onclick="cambiarSeccion('Compras')">Compras</button>
                <button id="tabInventario" class="nav-btn" type="button" onclick="cambiarSeccion('Inventario')">Inventario</button>
                <button id="tabCorte" class="nav-btn" type="button" onclick="cambiarSeccion('Corte')">Corte de Caja</button>
            </nav>

            <div class="user-actions">
                <span id="lblUsuarioEmail" class="card-meta"></span>
                <button id="btnModoOscuro" class="btn btn-secondary" type="button" onclick="toggleModoOscuro()">Modo oscuro</button>
                <button class="btn btn-secondary" type="button" onclick="sincronizarManual()">Sincronizar</button>
                <button class="btn btn-secondary" type="button" onclick="cerrarSesion()">Salir</button>
            </div>
        </header>

        <main class="container">
            <!-- SECCIÓN COMPRAS -->
            <section id="secCompras">
                <div class="toolbar">
                    <input id="txtBuscarCompras" class="search-input" type="text" placeholder="Buscar insumo para reabastecer..." oninput="renderCompras()" />
                    <button class="btn btn-success" type="button" onclick="abrirModalNuevoInsumo('Compra')">+ Registrar Nueva Compra / Insumo</button>
                </div>
                <div id="listaCompras" class="grid-cards"></div>
            </section>

            <!-- SECCIÓN INVENTARIO -->
            <section id="secInventario" class="hidden">
                <div class="toolbar">
                    <input id="txtBuscarInventario" class="search-input" type="text" placeholder="Buscar insumo en inventario..." oninput="renderInventario()" />
                    <button class="btn" type="button" onclick="abrirModalNuevoInsumo('Inventario')">+ Nuevo Insumo</button>
                </div>
                <div id="listaInventario" class="grid-cards"></div>
            </section>

            <!-- SECCIÓN CORTE DE CAJA -->
            <section id="secCorte" class="hidden">
                <div class="turno-box">
                    <div>
                        <div id="lblEstadoTurno" style="font-weight:700;">Turno</div>
                        <div id="lblFechaOperativa" class="card-meta"></div>
                    </div>
                    <div style="display:flex; gap:8px; flex-wrap:wrap;">
                        <button id="btnToggleTurno" class="btn btn-success" type="button" onclick="toggleTurno()">Abrir Turno</button>
                        <button class="btn" type="button" onclick="registrarGastoManual()">+ Registrar Gasto</button>
                    </div>
                </div>

                <div class="toolbar">
                    <div class="pill-row">
                        <button id="filtroDia" class="pill-btn active" type="button" onclick="cambiarPeriodo('Dia')">Día</button>
                        <button id="filtroSemanal" class="pill-btn" type="button" onclick="cambiarPeriodo('Semanal')">Semanal</button>
                        <button id="filtroMensual" class="pill-btn" type="button" onclick="cambiarPeriodo('Mensual')">Mensual</button>
                    </div>

                    <div class="pill-row">
                        <button id="subTabFacturas" class="pill-btn active" type="button" onclick="cambiarSubTabCorte('Facturas')">Facturas</button>
                        <button id="subTabGastos" class="pill-btn" type="button" onclick="cambiarSubTabCorte('Gastos')">Recibos Compras / Mermas</button>
                    </div>
                </div>

                <div class="kpi-grid">
                    <div class="kpi-card">
                        <div class="kpi-label">Ventas</div>
                        <div id="kpiVentas" class="kpi-value">$0</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Gastos Insumos</div>
                        <div id="kpiGastos" class="kpi-value">$0</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Ganancia Neta</div>
                        <div id="kpiGanancia" class="kpi-value">$0</div>
                    </div>
                </div>

                <div id="panelFacturas" class="list-box"></div>
                <div id="panelGastos" class="list-box hidden"></div>
            </section>
        </main>
    </div>

    <!-- MODAL REABASTECER (COMPRAS) -->
    <div id="modalRestock" class="modal-backdrop hidden">
        <div class="modal-card">
            <h3 id="restockTitulo" style="margin-top:0;">Reabastecer</h3>

            <div id="restockModoBox" class="form-group hidden">
                <label id="restockModoLabel">Modo de compra</label>
                <div class="pill-row">
                    <button id="btnRestockModo1" class="pill-btn active" type="button" onclick="setRestockModoMayor(false)">Modo 1</button>
                    <button id="btnRestockModo2" class="pill-btn" type="button" onclick="setRestockModoMayor(true)">Modo 2</button>
                </div>
            </div>

            <div id="restockFactorBox" class="form-group hidden">
                <label id="restockFactorLabel">Unidades por paquete / porciones por kilo</label>
                <input id="txtRestockFactor" class="input" type="number" step="any" min="0" />
            </div>

            <div class="form-group">
                <label id="lblRestockCantidad" for="txtRestockCantidad">Cantidad a sumar</label>
                <input id="txtRestockCantidad" class="input" type="number" step="any" min="0" />
            </div>

            <div class="form-group">
                <label for="txtRestockCosto">Costo de esta compra ($)</label>
                <input id="txtRestockCosto" class="input" type="number" step="any" min="0" placeholder="0" />
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" onclick="cerrarModalRestock()">Cancelar</button>
                <button class="btn btn-success" type="button" onclick="guardarRestock()">Guardar Compra</button>
            </div>
        </div>
    </div>

    <!-- MODAL CREAR / EDITAR INSUMO -->
    <div id="modalInsumo" class="modal-backdrop hidden">
        <div class="modal-card">
            <h3 id="insumoModalTitulo" style="margin-top:0;">Insumo</h3>

            <div class="form-group">
                <label for="txtInsumoNombre">Nombre</label>
                <input id="txtInsumoNombre" class="input" type="text" placeholder="Ej: Pan perro, Queso, Aceite" />
            </div>

            <div class="form-group">
                <label>Tipo de registro</label>
                <div class="pill-row">
                    <button id="btnTipoUnitario" class="pill-btn active" type="button" onclick="setModoPesoForm(false)">Unitario / Empaque</button>
                    <button id="btnTipoPeso" class="pill-btn" type="button" onclick="setModoPesoForm(true)">Peso / Volumen</button>
                </div>
            </div>

            <div class="form-group">
                <label>Unidad de medida</label>
                <div class="pill-row">
                    <button class="pill-btn unidad-btn" data-unidad="Unidad" type="button" onclick="setUnidadForm('Unidad')">Unidad</button>
                    <button class="pill-btn unidad-btn" data-unidad="Gramos" type="button" onclick="setUnidadForm('Gramos')">Gramos</button>
                    <button class="pill-btn unidad-btn" data-unidad="Kilogramos" type="button" onclick="setUnidadForm('Kilogramos')">Kilogramos</button>
                    <button class="pill-btn unidad-btn" data-unidad="Mililitros" type="button" onclick="setUnidadForm('Mililitros')">Mililitros</button>
                    <button class="pill-btn unidad-btn" data-unidad="Litros" type="button" onclick="setUnidadForm('Litros')">Litros</button>
                </div>
            </div>

            <div class="form-group">
                <label id="lblInsumoStock" for="txtInsumoStock">Cantidad</label>
                <input id="txtInsumoStock" class="input" type="number" step="any" min="0" placeholder="0" />
            </div>

            <div id="boxEmpaqueForm" class="form-group">
                <label for="txtUnidadesEmpaque">Unidades por paquete (opcional, > 1 si aplica)</label>
                <input id="txtUnidadesEmpaque" class="input" type="number" step="any" min="0" placeholder="1" />
            </div>

            <div id="boxPorcionesForm" class="form-group hidden">
                <label for="txtPorcionesKilo">Porciones por kilo / litro (opcional)</label>
                <input id="txtPorcionesKilo" class="input" type="number" step="any" min="0" placeholder="0" />
            </div>

            <div class="form-group">
                <label>Tipo de costo</label>
                <div class="pill-row">
                    <button id="btnCostoTotal" class="pill-btn active" type="button" onclick="setEsCostoTotalForm(true)">Costo Total ($)</button>
                    <button id="btnCostoUnit" class="pill-btn" type="button" onclick="setEsCostoTotalForm(false)">Costo Unitario ($)</button>
                </div>
            </div>

            <div class="form-group">
                <label id="lblInsumoCosto" for="txtInsumoCosto">Valor ingresado ($)</label>
                <input id="txtInsumoCosto" class="input" type="number" step="any" min="0" placeholder="0" />
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" onclick="cerrarModalInsumo()">Cancelar</button>
                <button class="btn btn-success" type="button" onclick="guardarInsumoModal()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- MODAL MERMA -->
    <div id="modalMerma" class="modal-backdrop hidden">
        <div class="modal-card">
            <h3 id="mermaTitulo" style="margin-top:0;">Registrar Merma</h3>
            <p id="mermaInfo" class="card-meta"></p>

            <div class="form-group">
                <label for="txtMermaCantidad">Cantidad dañada / mermada a descontar</label>
                <input id="txtMermaCantidad" class="input" type="number" step="any" min="0" placeholder="0" />
            </div>

            <div class="form-group">
                <label for="txtMermaMonto">Trasladar valor desde Compras a Merma ($) (0 para omitir)</label>
                <input id="txtMermaMonto" class="input" type="number" step="any" min="0" placeholder="0" />
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" onclick="cerrarModalMerma()">Cancelar</button>
                <button class="btn btn-warning" type="button" onclick="guardarMerma()">Aplicar Merma</button>
            </div>
        </div>
    </div>

    <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
            import {
              getAuth,
              GoogleAuthProvider,
              signInWithPopup,
              signOut,
              onAuthStateChanged
            } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

            const firebaseConfig = {
              apiKey: "AIzaSyD_oOt_qQXqgoVrygBQuLrAZ2IBAkpEBdQ",
              authDomain: "viko-pos-app.firebaseapp.com",
              databaseURL: "https://viko-pos-app-default-rtdb.firebaseio.com",
              projectId: "viko-pos-app"
            };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const googleProvider = new GoogleAuthProvider();

            let currentUser = null;
            let idTokenActual = null;
            let userKeyActual = null;

            let estado = {
              Uid: "",
              Email: "",
              NombreNegocio: "",
              FechaActualizacion: "1970-01-01T00:00:00.000Z",
              Inventario: [],
              ProductosVenta: [],
              Turnos: [],
              Facturas: [],
              Gastos: []
            };

            let hayCambiosPendientes = false;
            let sincronizando = false;
            let seccionActual = "Compras";
            let periodoActual = "Dia";
            let subTabCorte = "Facturas";
            let modoOscuroActivo = false;

            // Estado modales
            let idRestockActual = null;
            let restockModoMayor = false;

            let idInsumoEditando = null;
            let origenModalInsumo = "Inventario";
            let esModoPesoForm = false;
            let esCostoTotalForm = true;
            let unidadFormSeleccionada = "Unidad";

            let idMermaActual = null;

            function obtenerClaveTemaUsuario() {
              return "viko_pos_dark_mode_" + (userKeyActual || "guest");
            }

            function aplicarEstadoModoOscuro(activo) {
              modoOscuroActivo = Boolean(activo);
              document.body.classList.toggle("dark-mode", modoOscuroActivo);
              const btn = document.getElementById("btnModoOscuro");
              if (btn) {
                btn.textContent = modoOscuroActivo ? "Modo claro" : "Modo oscuro";
              }
            }

            function cargarModoOscuroUsuario() {
              try {
                const guardado = localStorage.getItem(obtenerClaveTemaUsuario());
                aplicarEstadoModoOscuro(guardado === "1");
              } catch (e) {
                aplicarEstadoModoOscuro(false);
              }
            }

            window.toggleModoOscuro = function () {
              const siguiente = !modoOscuroActivo;
              aplicarEstadoModoOscuro(siguiente);
              try {
                localStorage.setItem(obtenerClaveTemaUsuario(), siguiente ? "1" : "0");
              } catch (e) {}
            };

            cargarModoOscuroUsuario();

            function sanitizarClaveFirebase(email) {
              return email.trim().toLowerCase()
                .replaceAll(".", "_")
                .replaceAll("@", "_at_")
                .replaceAll("$", "_")
                .replaceAll("#", "_")
                .replaceAll("[", "_")
                .replaceAll("]", "_");
            }

            function generarGuid() {
              if (crypto && crypto.randomUUID) return crypto.randomUUID();
              return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
                const r = (Math.random() * 16) | 0;
                const v = c === "x" ? r : (r & 0x3) | 0x8;
                return v.toString(16);
              });
            }

            function formatearMoneda(valor) {
              const num = Number(valor) || 0;
              return "$" + num.toLocaleString("es-CO", { maximumFractionDigits: 2 });
            }

            function obtenerMetricasCostoActual(insumo) {
              const stockActual = Math.max(0, Number(insumo.StockActual) || 0);
              const costoIngresado = Math.max(0, Number(insumo.CostoIngresado) || 0);
              const esCostoTotal = insumo.EsCostoTotal !== false;

              if (stockActual <= 0) {
                return {
                  costoUnitarioPromedio: 0,
                  valorStockActual: 0
                };
              }

              const valorStockActual = esCostoTotal
                ? costoIngresado
                : (costoIngresado * stockActual);

              const costoUnitarioPromedio = valorStockActual / stockActual;

              return {
                costoUnitarioPromedio,
                valorStockActual
              };
            }

            function setSyncStatus(texto) {
              const el = document.getElementById("lblSyncStatus");
              if (el) el.textContent = texto;
            }

            document.getElementById("btnGoogleLogin").addEventListener("click", async () => {
              const errEl = document.getElementById("loginError");
              errEl.textContent = "";
              try {
                await signInWithPopup(auth, googleProvider);
              } catch (err) {
                errEl.textContent = err?.message || "No se pudo iniciar sesión con Google.";
              }
            });

            window.cerrarSesion = async function () {
              await signOut(auth);
            };

            onAuthStateChanged(auth, async (user) => {
              if (!user || !user.email) {
                currentUser = null;
                idTokenActual = null;
                userKeyActual = null;
                cargarModoOscuroUsuario();
                document.getElementById("loginView").classList.remove("hidden");
                document.getElementById("appView").classList.add("hidden");
                return;
              }

              currentUser = user;
              userKeyActual = sanitizarClaveFirebase(user.email);
              cargarModoOscuroUsuario();
              idTokenActual = await user.getIdToken(true);

              document.getElementById("loginView").classList.add("hidden");
              document.getElementById("appView").classList.remove("hidden");
              document.getElementById("lblUsuarioEmail").textContent = user.email;

              await descargarRemoto(true);
              renderTodo();
            });

            setInterval(async () => {
              if (!currentUser || sincronizando || hayCambiosPendientes) return;
              await descargarRemoto(false);
            }, 5000);

            window.sincronizarManual = async function () {
              if (!currentUser) return;
              if (hayCambiosPendientes) {
                await subirCambios();
              }
              await descargarRemoto(true);
            };

            async function refrescarTokenSiNecesario() {
              if (!currentUser) return null;
              idTokenActual = await currentUser.getIdToken(false);
              return idTokenActual;
            }

            async function descargarRemoto(forzarRender) {
              if (!currentUser || !userKeyActual || sincronizando || hayCambiosPendientes) return;
              sincronizando = true;
              try {
                const token = await refrescarTokenSiNecesario();
                if (!token) return;

                const url = `${firebaseConfig.databaseURL}/usuarios/${userKeyActual}.json?auth=${encodeURIComponent(token)}`;
                const resp = await fetch(url);
                if (!resp.ok) {
                  setSyncStatus("Error al leer Firebase (" + resp.status + ")");
                  return;
                }

                const remoto = await resp.json();
                if (!remoto) {
                  setSyncStatus("Sin datos previos en nube • Listo");
                  return;
                }

                const fechaRemota = Date.parse(remoto.FechaActualizacion || 0) || 0;
                const fechaLocal = Date.parse(estado.FechaActualizacion || 0) || 0;

                if (fechaRemota > fechaLocal || forzarRender) {
                  estado = {
                    Uid: remoto.Uid || currentUser.uid,
                    Email: remoto.Email || currentUser.email,
                    NombreNegocio: remoto.NombreNegocio || "",
                    FechaActualizacion: remoto.FechaActualizacion || new Date().toISOString(),
                    Inventario: Array.isArray(remoto.Inventario) ? remoto.Inventario : [],
                    ProductosVenta: Array.isArray(remoto.ProductosVenta) ? remoto.ProductosVenta : [],
                    Turnos: Array.isArray(remoto.Turnos) ? remoto.Turnos : [],
                    Facturas: Array.isArray(remoto.Facturas) ? remoto.Facturas : [],
                    Gastos: Array.isArray(remoto.Gastos) ? remoto.Gastos : []
                  };

                  const negocioLimpio = (estado.NombreNegocio || "").trim();
                  const mostrarNegocio = negocioLimpio && negocioLimpio.toLowerCase() !== "burger master"
                    ? negocioLimpio
                    : "Viko POS";
                  document.getElementById("lblNegocio").textContent = mostrarNegocio;

                  renderTodo();
                }

                const hora = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
                setSyncStatus("Sincronizado • " + hora);
              } catch (e) {
                setSyncStatus("Sin conexión con Firebase");
              } finally {
                sincronizando = false;
              }
            }

            function marcarCambioYSubir() {
              estado.Uid = currentUser?.uid || estado.Uid;
              estado.Email = currentUser?.email || estado.Email;
              estado.FechaActualizacion = new Date().toISOString();
              hayCambiosPendientes = true;
              renderTodo();
              subirCambios();
            }

            async function subirCambios() {
              if (!currentUser || !userKeyActual) return;
              sincronizando = true;
              setSyncStatus("Subiendo cambios...");
              try {
                const token = await currentUser.getIdToken(true);
                idTokenActual = token;
                const url = `${firebaseConfig.databaseURL}/usuarios/${userKeyActual}.json?auth=${encodeURIComponent(token)}`;
                const resp = await fetch(url, {
                  method: "PUT",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(estado)
                });
                if (resp.ok) {
                  hayCambiosPendientes = false;
                  const hora = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
                  setSyncStatus("Guardado y sincronizado • " + hora);
                } else {
                  setSyncStatus("Error al guardar en Firebase (" + resp.status + ")");
                }
              } catch (e) {
                setSyncStatus("Cambio pendiente (sin red)");
              } finally {
                sincronizando = false;
              }
            }

            // Navegación
            window.cambiarSeccion = function (sec) {
              seccionActual = sec;
              document.getElementById("tabCompras").classList.toggle("active", sec === "Compras");
              document.getElementById("tabInventario").classList.toggle("active", sec === "Inventario");
              document.getElementById("tabCorte").classList.toggle("active", sec === "Corte");

              document.getElementById("secCompras").classList.toggle("hidden", sec !== "Compras");
              document.getElementById("secInventario").classList.toggle("hidden", sec !== "Inventario");
              document.getElementById("secCorte").classList.toggle("hidden", sec !== "Corte");

              renderTodo();
            };

            function renderTodo() {
              if (seccionActual === "Compras") renderCompras();
              else if (seccionActual === "Inventario") renderInventario();
              else if (seccionActual === "Corte") renderCorte();
            }

            function formatearStock(insumo) {
              const stock = Number(insumo.StockActual) || 0;
              const unidad = insumo.UnidadMedida || "Unidad";
              return `${stock} ${unidad}`;
            }

            // COMPRAS
            window.renderCompras = function () {
              const filtro = (document.getElementById("txtBuscarCompras").value || "").trim().toLowerCase();
              const cont = document.getElementById("listaCompras");
              const items = (estado.Inventario || []).filter(i =>
                !filtro || (i.Nombre || "").toLowerCase().includes(filtro)
              );

              if (items.length === 0) {
                cont.innerHTML = `<div class="card"><div class="card-meta">No hay insumos para mostrar.</div></div>`;
                return;
              }

              cont.innerHTML = items.map(i => {
                const { costoUnitarioPromedio, valorStockActual } = obtenerMetricasCostoActual(i);
                return `
                <div class="card">
                  <div>
                    <div class="card-title">${escaparHtml(i.Nombre)}</div>
                    <div class="card-meta">Stock actual: <strong>${escaparHtml(formatearStock(i))}</strong></div>
                    <div class="card-meta">Costo unit.: ${formatearMoneda(costoUnitarioPromedio)} • Stock actual: ${formatearMoneda(valorStockActual)}</div>
                  </div>
                  <div class="card-actions">
                    <button class="btn btn-success" type="button" onclick="abrirModalRestock('${i.Id}')">Reabastecer</button>
                  </div>
                </div>
              `;
              }).join("");
            };

            window.abrirModalRestock = function (id) {
              const insumo = (estado.Inventario || []).find(i => i.Id === id);
              if (!insumo) return;

              idRestockActual = insumo.Id;
              restockModoMayor = false;

              document.getElementById("restockTitulo").textContent = "Reabastecer: " + insumo.Nombre;
              document.getElementById("txtRestockCantidad").value = "";
              document.getElementById("txtRestockCosto").value = "";

              const uLower = (insumo.UnidadMedida || "").trim().toLowerCase();
              const modoBox = document.getElementById("restockModoBox");
              const factorBox = document.getElementById("restockFactorBox");

              if (insumo.ManejaPorciones) {
                modoBox.classList.remove("hidden");
                document.getElementById("restockModoLabel").textContent = "¿Cómo estás ingresando esta compra?";
                document.getElementById("btnRestockModo1").textContent = `Peso (${insumo.UnidadMedida})`;
                document.getElementById("btnRestockModo2").textContent = "Unidades (Piezas)";
                document.getElementById("restockFactorLabel").textContent = "¿Cuántas piezas trae este kilo (o proporción)?";
                document.getElementById("txtRestockFactor").value = insumo.PorcionesPorKilo || 0;
              } else if (insumo.ManejaEmpaque && Number(insumo.UnidadesPorEmpaque) > 1) {
                modoBox.classList.remove("hidden");
                document.getElementById("restockModoLabel").textContent = "¿Cómo estás ingresando esta compra?";
                document.getElementById("btnRestockModo1").textContent = `Unidades sueltas (${insumo.UnidadMedida})`;
                document.getElementById("btnRestockModo2").textContent = `Paquetes (habitual: ${insumo.UnidadesPorEmpaque})`;
                document.getElementById("restockFactorLabel").textContent = "Unidades por paquete";
                document.getElementById("txtRestockFactor").value = insumo.UnidadesPorEmpaque || 1;
              } else if (uLower.includes("gramo") || uLower.includes("kilo")) {
                modoBox.classList.remove("hidden");
                document.getElementById("restockModoLabel").textContent = "¿En qué unidad viene esta compra?";
                document.getElementById("btnRestockModo1").textContent = "Gramos (g)";
                document.getElementById("btnRestockModo2").textContent = "Kilogramos (kg)";
              } else if (uLower.includes("mililitro") || uLower.includes("litro") || uLower.includes("ml")) {
                modoBox.classList.remove("hidden");
                document.getElementById("restockModoLabel").textContent = "¿En qué unidad viene esta compra?";
                document.getElementById("btnRestockModo1").textContent = "Mililitros (ml)";
                document.getElementById("btnRestockModo2").textContent = "Litros (L)";
              } else {
                modoBox.classList.add("hidden");
              }

              factorBox.classList.add("hidden");
              actualizarEstilosRestockModo(insumo);
              document.getElementById("modalRestock").classList.remove("hidden");
            };

            window.setRestockModoMayor = function (esMayor) {
              restockModoMayor = esMayor;
              const insumo = (estado.Inventario || []).find(i => i.Id === idRestockActual);
              if (insumo) actualizarEstilosRestockModo(insumo);
            };

            function actualizarEstilosRestockModo(insumo) {
              document.getElementById("btnRestockModo1").classList.toggle("active", !restockModoMayor);
              document.getElementById("btnRestockModo2").classList.toggle("active", restockModoMayor);

              const uLower = (insumo.UnidadMedida || "").trim().toLowerCase();
              const factorBox = document.getElementById("restockFactorBox");

              if (insumo.ManejaEmpaque && Number(insumo.UnidadesPorEmpaque) > 1) {
                document.getElementById("lblRestockCantidad").textContent = restockModoMayor
                  ? "Cantidad de paquetes a sumar:"
                  : `Cantidad de ${insumo.UnidadMedida} sueltas a sumar:`;
                factorBox.classList.toggle("hidden", !restockModoMayor);
              } else if (insumo.ManejaPorciones) {
                document.getElementById("lblRestockCantidad").textContent = restockModoMayor
                  ? "Cantidad de unidades (piezas) a sumar:"
                  : `Cantidad a sumar (${insumo.UnidadMedida}):`;
                factorBox.classList.toggle("hidden", !restockModoMayor);
              } else if (uLower.includes("gramo") || uLower.includes("kilo")) {
                document.getElementById("lblRestockCantidad").textContent = restockModoMayor
                  ? "Cantidad a sumar (Kilogramos):"
                  : "Cantidad a sumar (Gramos):";
                factorBox.classList.add("hidden");
              } else if (uLower.includes("mililitro") || uLower.includes("litro") || uLower.includes("ml")) {
                document.getElementById("lblRestockCantidad").textContent = restockModoMayor
                  ? "Cantidad a sumar (Litros):"
                  : "Cantidad a sumar (Mililitros):";
                factorBox.classList.add("hidden");
              } else {
                document.getElementById("lblRestockCantidad").textContent = `Cantidad a sumar al Stock (${insumo.UnidadMedida}):`;
                factorBox.classList.add("hidden");
              }
            }

            window.cerrarModalRestock = function () {
              document.getElementById("modalRestock").classList.add("hidden");
              idRestockActual = null;
            };

            window.guardarRestock = function () {
              const insumo = (estado.Inventario || []).find(i => i.Id === idRestockActual);
              if (!insumo) return;

              const cantIngresada = parseFloat(document.getElementById("txtRestockCantidad").value);
              if (isNaN(cantIngresada) || cantIngresada <= 0) {
                alert("Ingresa una cantidad válida a sumar.");
                return;
              }

              let costoCompra = parseFloat(document.getElementById("txtRestockCosto").value);
              if (isNaN(costoCompra) || costoCompra < 0) costoCompra = 0;

              let cantReal = cantIngresada;
              const uLower = (insumo.UnidadMedida || "").trim().toLowerCase();

              if (restockModoMayor) {
                const factorVal = parseFloat(document.getElementById("txtRestockFactor").value);
                if (insumo.ManejaEmpaque) {
                  const porPaquete = (!isNaN(factorVal) && factorVal > 0) ? factorVal : (Number(insumo.UnidadesPorEmpaque) || 1);
                  cantReal = cantIngresada * porPaquete;
                } else if (insumo.ManejaPorciones) {
                  const piezasPorKilo = (!isNaN(factorVal) && factorVal > 0) ? factorVal : (Number(insumo.PorcionesPorKilo) || 10);
                  const gramosPorUnidad = piezasPorKilo > 0 ? (1000 / piezasPorKilo) : 100;
                  cantReal = cantIngresada * gramosPorUnidad;
                } else if (uLower.includes("gramo") || uLower.includes("kilo") || uLower.includes("mililitro") || uLower.includes("litro")) {
                  cantReal = cantIngresada * 1000;
                }
              }

              const stockAnterior = Math.max(0, Number(insumo.StockActual) || 0);
              const { valorStockActual: costoTotalAnterior } = obtenerMetricasCostoActual(insumo);

              const nuevoStockTotal = stockAnterior + cantReal;
              const nuevoCostoTotalInventario = costoTotalAnterior + costoCompra;

              insumo.StockActual = nuevoStockTotal;
              insumo.CostoIngresado = nuevoCostoTotalInventario;
              insumo.EsCostoTotal = true;

              if (costoCompra > 0) {
                registrarGastoInterno("Compra: " + insumo.Nombre, costoCompra);
              }

              cerrarModalRestock();
              marcarCambioYSubir();
            };

            window.abrirModalNuevoInsumo = function (origen) {
              origenModalInsumo = origen || "Inventario";

              document.getElementById("insumoModalTitulo").textContent = origen === "Compra" ? "Registrar Compra / Insumo" : "Registrar Insumo";
              document.getElementById("txtInsumoNombre").value = "";
              document.getElementById("txtInsumoStock").value = "";
              document.getElementById("txtUnidadesEmpaque").value = "";
              document.getElementById("txtPorcionesKilo").value = "";
              document.getElementById("txtInsumoCosto").value = "";

              setEsCostoTotalForm(true);

              document.getElementById("modalInsumo").classList.remove("hidden");

            window.abrirModalEditarInsumo = function (id) {
              const insumo = (estado.Inventario || []).find(i => i.Id === id);
              if (!insumo) return;

              origenModalInsumo = "Inventario";
              idInsumoEditando = insumo.Id;
              document.getElementById("insumoModalTitulo").textContent = "Modificar Insumo";
              document.getElementById("txtInsumoNombre").value = insumo.Nombre || "";
              document.getElementById("txtInsumoStock").value = insumo.StockActual ?? 0;
              document.getElementById("txtUnidadesEmpaque").value = Number(insumo.UnidadesPorEmpaque) > 1 ? insumo.UnidadesPorEmpaque : "";
              document.getElementById("txtPorcionesKilo").value = Number(insumo.PorcionesPorKilo) > 0 ? insumo.PorcionesPorKilo : "";
              document.getElementById("txtInsumoCosto").value = insumo.CostoIngresado ?? 0;

              setModoPesoForm(Boolean(insumo.ManejaPorciones));
              setEsCostoTotalForm(insumo.EsCostoTotal !== false);
              setUnidadForm(insumo.UnidadMedida || "Unidad");
              document.getElementById("modalInsumo").classList.remove("hidden");
            };

            window.setModoPesoForm = function (esPeso) {
              esModoPesoForm = esPeso;
              document.getElementById("btnTipoUnitario").classList.toggle("active", !esPeso);
              document.getElementById("btnTipoPeso").classList.toggle("active", esPeso);
              document.getElementById("boxEmpaqueForm").classList.toggle("hidden", esPeso);
              document.getElementById("boxPorcionesForm").classList.toggle("hidden", !esPeso);
              document.getElementById("lblInsumoStock").textContent = esPeso ? "Cantidad (Kilos / Litros):" : "Cantidad:";
            };

            window.setUnidadForm = function (unidad) {
              unidadFormSeleccionada = unidad;
              document.querySelectorAll(".unidad-btn").forEach(btn => {
                btn.classList.toggle("active", btn.dataset.unidad === unidad);

            window.setEsCostoTotalForm = function (esTotal) {
              esCostoTotalForm = esTotal;
              document.getElementById("btnCostoTotal").classList.toggle("active", esTotal);
              document.getElementById("btnCostoUnit").classList.toggle("active", !esTotal);
              document.getElementById("lblInsumoCosto").textContent = esTotal ? "Valor ingresado ($):" : "Costo unitario ($):";
            };

            window.cerrarModalInsumo = function () {
              document.getElementById("modalInsumo").classList.add("hidden");
              idInsumoEditando = null;
            };

            window.guardarInsumoModal = function () {
              const nombre = (document.getElementById("txtInsumoNombre").value || "").trim();
              if (!nombre) {
                alert("Debes ingresar un nombre para el insumo.");
                return;
              }

              const stock = parseFloat(document.getElementById("txtInsumoStock").value) || 0;
              const costo = parseFloat(document.getElementById("txtInsumoCosto").value) || 0;
              const unidadesPaquete = parseFloat(document.getElementById("txtUnidadesEmpaque").value) || 1;
              const porciones = parseFloat(document.getElementById("txtPorcionesKilo").value) || 0;

              const manejaEmpaque = !esModoPesoForm && unidadesPaquete > 1;
              const manejaPorciones = esModoPesoForm && porciones > 0;
              const stockReal = manejaEmpaque && unidadesPaquete > 1 ? stock * unidadesPaquete : stock;

              if (!idInsumoEditando) {
                estado.Inventario.push({
                  Id: generarGuid(),
                  Nombre: nombre,
                  StockActual: stockReal,
                  UnidadMedida: unidadFormSeleccionada,
                  CostoIngresado: costo,
                  EsCostoTotal: esCostoTotalForm,
                  ManejaPorciones: manejaPorciones,
                  PorcionesPorKilo: porciones,
                  ManejaEmpaque: manejaEmpaque,
                  UnidadesPorEmpaque: unidadesPaquete
                });

                if (costo > 0) {
                  const montoGasto = esCostoTotalForm ? costo : (costo * stock);
                  registrarGastoInterno(origenModalInsumo === "Compra" ? "Compra: " + nombre : nombre, montoGasto);
                }
              } else {
                const insumo = estado.Inventario.find(i => i.Id === idInsumoEditando);
                if (insumo) {
                  insumo.Nombre = nombre;
                  insumo.StockActual = stockReal;
                  insumo.UnidadMedida = unidadFormSeleccionada;
                  insumo.CostoIngresado = costo;
                  insumo.EsCostoTotal = esCostoTotalForm;
                  insumo.ManejaPorciones = manejaPorciones;
                  insumo.PorcionesPorKilo = porciones;
                  insumo.ManejaEmpaque = manejaEmpaque;
                  insumo.UnidadesPorEmpaque = unidadesPaquete;
                }
              }

              cerrarModalInsumo();
              marcarCambioYSubir();
            };

            window.eliminarInsumo = function (id) {
              if (!confirm("¿Deseas eliminar este insumo?")) return;
              estado.Inventario = (estado.Inventario || []).filter(i => i.Id !== id);
              marcarCambioYSubir();
            };

            // MERMA
            window.abrirModalMerma = function (id) {
              const insumo = (estado.Inventario || []).find(i => i.Id === id);
              if (!insumo) return;
              idMermaActual = insumo.Id;
              document.getElementById("mermaTitulo").textContent = "Merma: " + insumo.Nombre;
              document.getElementById("mermaInfo").textContent = `Stock actual: ${formatearStock(insumo)}`;
              document.getElementById("txtMermaCantidad").value = "";
              document.getElementById("txtMermaMonto").value = "0";
              document.getElementById("modalMerma").classList.remove("hidden");
            };

            window.cerrarModalMerma = function () {
              document.getElementById("modalMerma").classList.add("hidden");
              idMermaActual = null;
            };

            window.guardarMerma = function () {
              const insumo = (estado.Inventario || []).find(i => i.Id === idMermaActual);
              if (!insumo) return;

              const cantMerma = parseFloat(document.getElementById("txtMermaCantidad").value);
              if (isNaN(cantMerma) || cantMerma <= 0) {
                alert("Ingresa una cantidad mayor a cero.");
                return;
              }

              const stockAnterior = Math.max(0, Number(insumo.StockActual) || 0);
              const { costoUnitarioPromedio } = obtenerMetricasCostoActual(insumo);
              const stockDescontado = Math.min(stockAnterior, cantMerma);
              const nuevoStock = Math.max(0, stockAnterior - cantMerma);

              insumo.StockActual = nuevoStock;
              if (insumo.EsCostoTotal !== false) {
                insumo.CostoIngresado = Math.max(0, (Number(insumo.CostoIngresado) || 0) - (stockDescontado * costoUnitarioPromedio));
              }

              const montoMerma = parseFloat(document.getElementById("txtMermaMonto").value) || 0;
              if (montoMerma > 0) {
                trasladarCompraAMermaInterno(insumo.Nombre, montoMerma);
              }

              cerrarModalMerma();
              marcarCambioYSubir();
            };

            function trasladarCompraAMermaInterno(conceptoInsumo, montoMerma) {
              if (montoMerma <= 0) return;
              const nombreLimpio = (conceptoInsumo || "").trim();
              const conceptoCompra = "Compra: " + nombreLimpio;

              const compraReciente = (estado.Gastos || []).find(g =>
                Number(g.Monto) > 0 &&
                ((g.Concepto || "").toLowerCase() === conceptoCompra.toLowerCase() ||
                 (g.Concepto || "").toLowerCase() === nombreLimpio.toLowerCase())
              );

              let montoTrasladado = montoMerma;
              if (compraReciente) {
                const montoCompraActual = Number(compraReciente.Monto) || 0;
                if (montoCompraActual > montoMerma) {
                  compraReciente.Monto = Math.round((montoCompraActual - montoMerma) * 100) / 100;
                } else {
                  montoTrasladado = montoCompraActual;
                  estado.Gastos = estado.Gastos.filter(g => g.Id !== compraReciente.Id);
                }
              }

              if (montoTrasladado > 0) {
                const turno = obtenerTurnoAbierto() || abrirTurnoInterno();
                estado.Gastos.unshift({
                  Id: generarGuid(),
                  TurnoId: turno.Id,
                  FechaOperativa: turno.FechaOperativa,
                  FechaHoraRegistro: new Date().toISOString(),
                  Concepto: nombreLimpio ? "Merma: " + nombreLimpio : "Merma",
                  Monto: montoTrasladado
                });
              }
            }

            // CORTE DE CAJA
            function obtenerFechaOperativa(fechaObj) {
              const f = new Date(fechaObj);
              if (f.getHours() < 6) {
                f.setDate(f.getDate() - 1);
              }
              return f.toISOString().slice(0, 10) + "T00:00:00";
            }

            function obtenerTurnoAbierto() {
              return (estado.Turnos || []).find(t => !t.FechaCierre);
            }

            function abrirTurnoInterno() {
              const existente = obtenerTurnoAbierto();
              if (existente) return existente;
              const ahora = new Date();
              const nuevo = {
                Id: generarGuid(),
                FechaApertura: ahora.toISOString(),
                FechaCierre: null,
                FechaOperativa: obtenerFechaOperativa(ahora)
              };
              estado.Turnos = estado.Turnos || [];
              estado.Turnos.unshift(nuevo);
              return nuevo;
            }

            function registrarGastoInterno(concepto, monto) {
              if (!monto || monto <= 0) return;
              const turno = obtenerTurnoAbierto() || abrirTurnoInterno();
              estado.Gastos = estado.Gastos || [];
              estado.Gastos.unshift({
                Id: generarGuid(),
                TurnoId: turno.Id,
                FechaOperativa: turno.FechaOperativa,
                FechaHoraRegistro: new Date().toISOString(),
                Concepto: (concepto || "Compra de insumos").trim(),
                Monto: monto
              });
            }

            window.toggleTurno = function () {
              const actual = obtenerTurnoAbierto();
              if (!actual) {
                abrirTurnoInterno();
                marcarCambioYSubir();
              } else {
                if (!confirm("¿Deseas cerrar el turno operativo actual y realizar el corte de caja?")) return;
                actual.FechaCierre = new Date().toISOString();
                marcarCambioYSubir();
              }
            };

            window.registrarGastoManual = function () {
              const concepto = prompt("Concepto o insumo comprado:");
              if (concepto === null) return;
              const montoStr = prompt("Monto del gasto ($):");
              if (montoStr === null) return;
              const monto = parseFloat(montoStr);
              if (isNaN(monto) || monto <= 0) {
                alert("Ingresa un monto válido mayor a 0.");
                return;
              }
              registrarGastoInterno(concepto, monto);
              marcarCambioYSubir();
            };

            window.cambiarPeriodo = function (per) {
              periodoActual = per;
              document.getElementById("filtroDia").classList.toggle("active", per === "Dia");
              document.getElementById("filtroSemanal").classList.toggle("active", per === "Semanal");
              document.getElementById("filtroMensual").classList.toggle("active", per === "Mensual");
              renderCorte();
            };

            window.cambiarSubTabCorte = function (tab) {
              subTabCorte = tab;
              document.getElementById("subTabFacturas").classList.toggle("active", tab === "Facturas");
              document.getElementById("subTabGastos").classList.toggle("active", tab === "Gastos");
              document.getElementById("panelFacturas").classList.toggle("hidden", tab !== "Facturas");
              document.getElementById("panelGastos").classList.toggle("hidden", tab !== "Gastos");
            };

            window.eliminarFactura = function (facturaId) {
              if (!confirm("¿Deseas eliminar esta factura? Se restará del total de ventas y los insumos volverán al inventario.")) return;
              const fac = (estado.Facturas || []).find(f => f.Id === facturaId);
              if (!fac) return;

              if (Array.isArray(fac.InsumosDescontados)) {
                fac.InsumosDescontados.forEach(ing => {
                  const ins = (estado.Inventario || []).find(i => i.Id === ing.InsumoId);
                  if (ins) {
                    const cantDevuelta = Number(ing.Cantidad) || 0;
                    const { costoUnitarioPromedio } = obtenerMetricasCostoActual(ins);
                    ins.StockActual = (Number(ins.StockActual) || 0) + cantDevuelta;
                    if (ins.EsCostoTotal !== false) {
                      ins.CostoIngresado = (Number(ins.CostoIngresado) || 0) + (cantDevuelta * costoUnitarioPromedio);
                    }
                  }
                });
              }

              estado.Facturas = estado.Facturas.filter(f => f.Id !== facturaId);
              marcarCambioYSubir();
            };

            window.eliminarGasto = function (gastoId) {
              if (!confirm("¿Deseas eliminar este recibo?")) return;
              estado.Gastos = (estado.Gastos || []).filter(g => g.Id !== gastoId);
              marcarCambioYSubir();
            };

            function obtenerRangoPeriodo() {
              const turno = obtenerTurnoAbierto();
              const refStr = turno?.FechaOperativa || obtenerFechaOperativa(new Date());
              const refDate = new Date(refStr.slice(0, 10) + "T00:00:00");

              let inicio = new Date(refDate);
              let fin = new Date(refDate);

              if (periodoActual === "Semanal") {
                const diffLunes = (refDate.getDay() + 6) % 7;
                inicio.setDate(refDate.getDate() - diffLunes);
                fin = new Date(inicio);
                fin.setDate(inicio.getDate() + 6);
              } else if (periodoActual === "Mensual") {
                inicio = new Date(refDate.getFullYear(), refDate.getMonth(), 1);
                fin = new Date(refDate.getFullYear(), refDate.getMonth() + 1, 0);
              }

              return {
                inicioStr: inicio.toISOString().slice(0, 10),
                finStr: fin.toISOString().slice(0, 10),
                refStr: refStr.slice(0, 10),
                turno
              };
            }

            window.renderCorte = function () {
              const { inicioStr, finStr, refStr, turno } = obtenerRangoPeriodo();

              document.getElementById("lblEstadoTurno").textContent = turno
                ? "Turno activo"
                : "Sin turno abierto";
              document.getElementById("lblFechaOperativa").textContent = "Día operativo de referencia: " + refStr;
              document.getElementById("btnToggleTurno").textContent = turno ? "Cerrar Turno" : "Abrir Turno";
              document.getElementById("btnToggleTurno").className = turno ? "btn btn-danger" : "btn btn-success";

              const facturasPeriodo = (estado.Facturas || []).filter(f => {
                const fOp = (f.FechaOperativa || "").slice(0, 10);
                return fOp >= inicioStr && fOp <= finStr;
              });

              const gastosPeriodo = (estado.Gastos || []).filter(g => {
                const gOp = (g.FechaOperativa || "").slice(0, 10);
                return gOp >= inicioStr && gOp <= finStr;
              });

              const totalVentas = facturasPeriodo.reduce((acc, f) => acc + (Number(f.TotalCobrado) || 0), 0);
              const totalGastos = gastosPeriodo.reduce((acc, g) => acc + (Number(g.Monto) || 0), 0);
              const gananciaNeta = Math.round((totalVentas - totalGastos) * 100) / 100;

              document.getElementById("kpiVentas").textContent = formatearMoneda(totalVentas);
              document.getElementById("kpiGastos").textContent = formatearMoneda(totalGastos);
              const kpiGanEl = document.getElementById("kpiGanancia");
              kpiGanEl.textContent = formatearMoneda(gananciaNeta);
              kpiGanEl.style.color = gananciaNeta >= 0 ? "var(--success)" : "var(--danger)";

              const panelFac = document.getElementById("panelFacturas");
              if (facturasPeriodo.length === 0) {
                panelFac.innerHTML = `<div class="card-meta">No hay facturas en este período.</div>`;
              } else {
                panelFac.innerHTML = facturasPeriodo.map(f => `
                  <div class="list-row">
                    <div>
                      <strong>${formatearMoneda(f.TotalCobrado)}</strong> • ${escaparHtml(f.MetodoPago || "Efectivo")}
                      <div class="card-meta">${escaparHtml(f.ResumenProductos || "")}</div>
                    </div>
                    <button class="btn btn-danger" type="button" onclick="eliminarFactura('${f.Id}')">Eliminar</button>
                  </div>
                `).join("");
              }

              const panelGas = document.getElementById("panelGastos");
              if (gastosPeriodo.length === 0) {
                panelGas.innerHTML = `<div class="card-meta">No hay recibos de compra o merma en este período.</div>`;
              } else {
                panelGas.innerHTML = gastosPeriodo.map(g => `
                  <div class="list-row">
                    <div>
                      <strong>${escaparHtml(g.Concepto || "Gasto")}</strong> — ${formatearMoneda(g.Monto)}
                      <div class="card-meta">${escaparHtml((g.FechaHoraRegistro || "").replace("T", " ").slice(0, 16))}</div>
                    </div>
                    <button class="btn btn-danger" type="button" onclick="eliminarGasto('${g.Id}')">Eliminar</button>
                  </div>
                `).join("");
              }
            };

            function escaparHtml(str) {
              return String(str ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;");
            }
    </script>
</body>
</html>
